name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev --no-install-project
      - run: uv run ruff check .
      - run: uv run pytest -q
        env:
          CLAUSELEDGER_CONF: "0"
